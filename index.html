    function timeToMin(h, m, isPM) {
      let hour = h;
      if (isPM && hour !== 12) hour += 12;
      if (!isPM && hour === 12) hour = 0;
      return hour * 60 + m;
    }

    function minTo12H(totalMinutes) {
      let h = Math.floor(totalMinutes / 60) % 24;
      let m = Math.floor(totalMinutes % 60);
      let suffix = h >= 12 ? 'PM' : 'AM';
      let displayH = h % 12;
      if (displayH === 0) displayH = 12;
      let displayM = m < 10 ? '0' + m : m;
      return `${displayH}:${displayM} ${suffix}`;
    }

    function formatDuration(sec) {
      if (sec <= 0) return "00:00";
      let m = Math.floor(sec / 60);
      let s = Math.floor(sec % 60);
      return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
    }

    function formatHoursMins(totalSec) {
      if (totalSec <= 0) return "0m";
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      if (h === 0) return `${m}m`;
      return `${h}h ${m < 10 ? '0' + m : m}m`;

    function loadSettings() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const hashConfig = window.location.hash.slice(1);
        const configPayload = urlParams.get('config') || (hashConfig.startsWith('config=') ? hashConfig.split('config=')[1] : null);
        
        if (configPayload) {
          try {
            const decoded = JSON.parse(decodeURIComponent(atob(configPayload)));
            if (decoded && typeof decoded === 'object') {
              state = { ...state, ...decoded };
              saveSettings();
              showToast("Configuration imported from share link!", "success");
              if (window.history.replaceState) {
                window.history.replaceState(null, '', window.location.pathname);
              }
              return;
            }
          } catch (e) {
            console.warn("Could not parse configuration from link payload", e);
          }
        }

        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = { ...state, ...parsed };
        }
      } catch (err) {
        console.error("Error reading localStorage:", err);
      }
    }

      try {

          customLabels: state.customLabels,
          roomNumbers: state.roomNumbers,
          audioEnabled: state.audioEnabled,
          teamFocus: state.teamFocus,

    /* -------------------------------------------------------------
     * WEB AUDIO API: SYNTHESIZED 2-MINUTE WARNING CHIME
     * Self-contained, zero external audio dependencies
     * ------------------------------------------------------------- */
    let audioCtx = null;
    let lastChimePlayedKey = null;

    function playWarningChime() {
      if (!state.audioEnabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        
        // Tone 1: 659.25 Hz (E5)
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(659.25, now);
        gain1.gain.setValueAtTime(0, now);
        gain1.gain.linearRampToValueAtTime(0.25, now + 0.05);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.85);

        // Tone 2: 880 Hz (A5)
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880, now + 0.25);
        gain2.gain.setValueAtTime(0, now + 0.25);
        gain2.gain.linearRampToValueAtTime(0.3, now + 0.3);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.25);
        osc2.stop(now + 1.25);

      } catch (e) {
        console.warn("Web Audio chime playback error:", e);
      }
    }

        iconEl.className = 'w-5 h-5 text-emerald-400 flex-shrink-0';
      } else if (type === 'error') {

        iconEl.className = 'w-5 h-5 text-red-400 flex-shrink-0';
      } else {
        iconEl.setAttribute('data-lucide', 'info');
        iconEl.className = 'w-5 h-5 text-blue-400 flex-shrink-0';
      }

      if (window.lucide) lucide.createIcons();

      clearTimeout(toastTimer);
      toastEl.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
      toastEl.classList.add('translate-y-0', 'opacity-100');

    /* -------------------------------------------------------------
     * TIME EVALUATION ENGINE & GROUPING LOGIC
     * ------------------------------------------------------------- */
    function getCurrentTimeInfo() {
      const now = new Date();
      const isSimulated = state.simulatedMinutes !== null;
      
      let totalMinutes;
      let seconds;
      let dayOfWeek = now.getDay(); // 0 = Sun, 6 = Sat

      if (isSimulated) {
        totalMinutes = state.simulatedMinutes;
        seconds = 0;
        dayOfWeek = 1;
      } else {
        totalMinutes = now.getHours() * 60 + now.getMinutes();
        seconds = now.getSeconds();
      }

      return {
        now,
        totalMinutes,
        seconds,
        isSimulated,
        dayOfWeek,
        formattedTime: isSimulated 
          ? `${minTo12H(totalMinutes)} (Simulated)` 
          : now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true }),
        formattedDate: now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })
      };
    }

    function evaluateTeamStatus(teamName, currentMin, currentSec, schedule) {
      const slots = schedule.teams[teamName];
      if (!slots || slots.length === 0) return null;

      const openMin = schedule.openTimeMin;
      const closeMin = schedule.closeTimeMin;

      if (currentMin < openMin) {
        return {
          type: 'off_hours',
          state: 'before_school',
          title: 'School Closed',
          subtitle: `Classes resume today at ${minTo12H(openMin)}`,
          periodKey: 'closed',
          startMin: 0,
          endMin: openMin,
          remainingSec: (openMin - currentMin) * 60 - currentSec,
          totalSec: openMin * 60,
          progressPct: 0,
        };
      }

      if (currentMin >= closeMin) {
        return {
          type: 'off_hours',
          state: 'after_school',
          title: 'School Closed',
          subtitle: state.scheduleMode === 'late' ? 'Classes resume tomorrow at 10:55 AM' : 'Classes resume tomorrow at 8:55 AM',
          periodKey: 'closed',
          startMin: closeMin,
          endMin: 1440,
          remainingSec: 0,
          totalSec: 0,
          progressPct: 100,
        };
      }

      for (let i = 0; i < slots.length; i++) {
        const slot = slots[i];
        if (currentMin >= slot.start && currentMin < slot.end) {
          const startSec = slot.start * 60;
          const endSec = slot.end * 60;
          const curSec = currentMin * 60 + currentSec;
          const elapsed = curSec - startSec;
          const total = endSec - startSec;
          const remaining = Math.max(0, total - elapsed);
          const progressPct = Math.min(100, Math.max(0, (elapsed / total) * 100));

          let customName = null;
          let roomNumber = null;
          if (slot.period) {
            customName = state.customLabels[slot.period] || null;
            roomNumber = state.roomNumbers[slot.period] || null;
          }

          let displayTitle = slot.label || '';
          if (slot.type === 'passing') {
            displayTitle = `Passing Period: ${slot.from} → ${slot.to}`;
          }

          return {
            type: slot.type,
            periodKey: slot.period || 'passing',
            title: displayTitle,
            customName,
            roomNumber,
            startMin: slot.start,
            endMin: slot.end,
            timeWindowStr: `${minTo12H(slot.start)} – ${minTo12H(slot.end)}`,
            remainingSec: remaining,
            totalSec: total,
            elapsedSec: elapsed,
            progressPct: progressPct,
            slotIndex: i,
            nextSlot: slots[i + 1] || null
          };
        }
      }

      return null;
    }

    function groupTeamsByStatus(currentMin, currentSec, schedule) {
      const activeTeams = state.teamFocus === 'all' ? TEAMS : [state.teamFocus];
      const teamStatusMap = {};

      activeTeams.forEach(team => {
        teamStatusMap[team] = evaluateTeamStatus(team, currentMin, currentSec, schedule);
      });

      const groups = [];
      const visited = new Set();

      activeTeams.forEach(team => {
        if (visited.has(team)) return;
        const statusA = teamStatusMap[team];
        if (!statusA) return;

        const matchingTeams = [team];
        visited.add(team);

        activeTeams.forEach(otherTeam => {
          if (visited.has(otherTeam)) return;
          const statusB = teamStatusMap[otherTeam];
          if (!statusB) return;

          const isSameType = statusA.type === statusB.type;
          const isSameWindow = statusA.startMin === statusB.startMin && statusA.endMin === statusB.endMin;
          const isSameTitle = statusA.title === statusB.title;

          if (isSameType && isSameWindow && isSameTitle) {
            matchingTeams.push(otherTeam);
            visited.add(otherTeam);
          }
        });

        let scopeLabel;
        if (matchingTeams.length === TEAMS.length) {
          scopeLabel = "All Teams";
        } else if (matchingTeams.length === 1) {
          scopeLabel = matchingTeams[0];
        } else {
          scopeLabel = matchingTeams.join(', ');
        }

        groups.push({
          teams: matchingTeams,
          scope: scopeLabel,
          status: statusA
        });
      });

      return groups;
    }

    /* -------------------------------------------------------------
     * DAY PROGRESS CALCULATION & MATRIX PROGRESS ROW
     * ------------------------------------------------------------- */
    function getDayProgressData(timeInfo) {
      const isLate = state.scheduleMode === 'late';
      const schedule = isLate ? SCHEDULE_LATE_START : SCHEDULE_NORMAL;
      const openMin = schedule.openTimeMin;
      const closeMin = schedule.closeTimeMin;
      const openSec = openMin * 60;
      const closeSec = closeMin * 60;
      const totalDaySec = closeSec - openSec;

      const curSec = timeInfo.totalMinutes * 60 + timeInfo.seconds;
      let elapsedSec = 0;
      let remainingSec = totalDaySec;
      let pct = 0;
      let statusBadgeText = "In Session";
      let statusBadgeClass = "bg-emerald-500/20 text-emerald-300 border-emerald-500/30";
      let elapsedRemainingText = "";

      if (timeInfo.dayOfWeek === 0 || timeInfo.dayOfWeek === 6) {
        statusBadgeText = "Weekend (Closed)";
        statusBadgeClass = "bg-slate-700/50 text-slate-400 border-slate-600";
        pct = 0;
        elapsedRemainingText = "Weekend • Classes resume Monday";
      } else if (curSec < openSec) {
        statusBadgeText = "Before School";
        statusBadgeClass = "bg-slate-700/50 text-slate-400 border-slate-600";
        pct = 0;
        const untilStart = openSec - curSec;
        elapsedRemainingText = `Starts in ${formatHoursMins(untilStart)} • Opens at ${minTo12H(openMin)}`;
      } else if (curSec >= closeSec) {
        statusBadgeText = "School Dismissed";
        statusBadgeClass = "bg-blue-500/20 text-blue-300 border-blue-500/30";
        pct = 100;
        elapsedSec = totalDaySec;
        remainingSec = 0;
        elapsedRemainingText = `${formatHoursMins(totalDaySec)} completed • Dismissed at ${minTo12H(closeMin)}`;
      } else {
        elapsedSec = curSec - openSec;
        remainingSec = Math.max(0, closeSec - curSec);
        pct = Math.min(100, Math.max(0, (elapsedSec / totalDaySec) * 100));
        statusBadgeText = "Classes In Session";
        statusBadgeClass = "bg-emerald-500/20 text-emerald-300 border-emerald-500/30";
        elapsedRemainingText = `${formatHoursMins(elapsedSec)} elapsed • ${formatHoursMins(remainingSec)} left until ${minTo12H(closeMin)}`;
      }

      return {
        openMin,
        closeMin,
        pct: Math.round(pct),
        elapsedRemainingText,
        statusBadgeText,
        statusBadgeClass,
        isSession: curSec >= openSec && curSec < closeSec
      };
    }

          if (r.universal) {
            const customName = r.key ? (state.customLabels[r.key] || '') : '';
            const roomNumber = r.key ? (state.roomNumbers[r.key] || '') : '';

            html += `
              <tr class="border-b border-slate-800/60 ${isLive ? 'bg-blue-950/40 font-semibold' : (r.passing ? 'bg-slate-900/20' : 'hover:bg-slate-800/30')} transition-colors">
                <td class="py-2.5 px-4 text-xs font-mono text-slate-300 whitespace-nowrap">
                  ${minTo12H(r.start)} – ${minTo12H(r.end)}
                </td>
                <td class="py-2.5 px-4 text-xs font-medium text-slate-200">
                  <span class="inline-flex items-center gap-1.5 ${r.passing ? 'text-amber-400' : 'text-white'}">
                    ${isLive ? '<span class="w-2 h-2 rounded-full bg-blue-400 animate-ping mr-1"></span>' : ''}
                    ${r.label}
                  </span>
                </td>
                <td colspan="5" class="py-2.5 px-4 text-xs text-slate-300">
                  ${r.passing ? '<span class="text-slate-400 italic">Passing Period for All Teams</span>' : `
                    <div class="flex items-center gap-3">
                      <span class="font-medium text-white">${customName ? customName : 'Standard Period'}</span>
                      ${roomNumber ? `<span class="px-2 py-0.5 rounded text-[11px] bg-slate-800 text-slate-300 border border-slate-700">Rm: ${roomNumber}</span>` : ''}
                    </div>
                  `}
                </td>
              </tr>
            `;
          } else {
            // Staggered periods
            html += `
              <tr class="border-b border-slate-800/60 ${isLive ? 'bg-indigo-950/30 font-semibold' : 'hover:bg-slate-800/30'} transition-colors">
                <td class="py-2.5 px-4 text-xs font-mono text-slate-300 whitespace-nowrap">
                  ${minTo12H(r.start)} – ${minTo12H(r.end)}
                </td>
                <td class="py-2.5 px-4 text-xs font-semibold text-white">
                  <span class="inline-flex items-center gap-1.5">
                    ${isLive ? '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping mr-1"></span>' : ''}
                    ${r.label}
                  </span>
                </td>
                
                <!-- 6A/6C -->
                <td class="py-2 px-3 text-xs border-l border-slate-800/50">
                  ${getTeamCellMarkup("6A / 6C", r.staggered, timeInfo.totalMinutes)}
                </td>
                <!-- 6B/7B -->
                <td class="py-2 px-3 text-xs border-l border-slate-800/50">
                  ${getTeamCellMarkup("6B / 7B", r.staggered, timeInfo.totalMinutes)}
                </td>
                <!-- 7A/7C -->
                <td class="py-2 px-3 text-xs border-l border-slate-800/50">
                  ${getTeamCellMarkup("7A / 7C", r.staggered, timeInfo.totalMinutes)}
                </td>
                <!-- 8B/8C -->
                <td class="py-2 px-3 text-xs border-l border-slate-800/50">
                  ${getTeamCellMarkup("8B / 8C", r.staggered, timeInfo.totalMinutes)}
                </td>
                <!-- 8A -->
                <td class="py-2 px-3 text-xs border-l border-slate-800/50">
                  ${getTeamCellMarkup("8A", r.staggered, timeInfo.totalMinutes)}
                </td>
              </tr>
            `;
          }
        });
      }

      tableBody.innerHTML = html;
    }

    function getTeamCellMarkup(teamName, periodCode, curMin) {
      const schedule = SCHEDULE_NORMAL.teams[teamName];
      const slot = schedule.find(s => s.period === periodCode);
      if (!slot) return '<span class="text-slate-500">-</span>';

      const isLive = curMin >= slot.start && curMin < slot.end;
      const isLunch = slot.type === 'lunch';
      const customName = state.customLabels[slot.period] || '';
      const roomNum = state.roomNumbers[slot.period] || '';

      let cellClass = isLunch 
        ? "bg-emerald-950/40 text-emerald-300 border border-emerald-500/30" 
        : "bg-slate-800/60 text-slate-200 border border-slate-700/60";

      if (isLive) {
        cellClass = isLunch 
          ? "bg-emerald-600/30 text-emerald-200 border-2 border-emerald-400 font-bold" 
          : "bg-blue-600/30 text-blue-200 border-2 border-blue-400 font-bold";
      }

      return `
        <div class="p-2 rounded-lg ${cellClass} transition-all">
          <div class="text-[11px] font-bold uppercase tracking-wider flex items-center justify-between gap-1">
            <span>${slot.label || slot.period}</span>
            <span class="font-mono text-[10px] text-slate-400">${minTo12H(slot.start)}</span>
          </div>
          ${customName ? `<div class="text-xs font-semibold truncate text-white mt-0.5">${customName}</div>` : ''}
          ${roomNum ? `<div class="text-[10px] text-slate-400 truncate">Rm: ${roomNum}</div>` : ''}
        </div>
      `;
    }

    /* -------------------------------------------------------------
     * MAIN TICK CONTROLLER (Runs every second)
     * ------------------------------------------------------------- */
    function tick() {
      const timeInfo = getCurrentTimeInfo();
      const isLate = state.scheduleMode === 'late';
      const schedule = isLate ? SCHEDULE_LATE_START : SCHEDULE_NORMAL;

      // Update Header Clocks
      const clockHeader = document.getElementById('liveClockDisplay');
      const clockMobile = document.getElementById('liveClockMobile');
      const dateDisplay = document.getElementById('liveDateDisplay');

      if (clockHeader) clockHeader.textContent = timeInfo.formattedTime;
      if (clockMobile) clockMobile.textContent = timeInfo.formattedTime;
      if (dateDisplay) dateDisplay.textContent = timeInfo.formattedDate;

      // Evaluate Team Groups
      const groups = groupTeamsByStatus(timeInfo.totalMinutes, timeInfo.seconds, schedule);

      // Render Dashboard & Smartboard
      renderDashboard(groups);
      renderSmartboard(groups, timeInfo);

      // 2-Minute Warning Chime Trigger Check
      groups.forEach(group => {
        const s = group.status;
        if (s && s.type !== 'off_hours' && s.remainingSec > 0 && s.remainingSec <= 120) {
          const chimeKey = `${s.periodKey}-${s.startMin}`;
          if (lastChimePlayedKey !== chimeKey) {
            lastChimePlayedKey = chimeKey;
            playWarningChime();
            showToast(`2-minute warning: ${s.title} wraps up soon!`, 'info');
          }
        }
      });

      // Periodically update matrix progress row
      const matrixContent = document.getElementById('matrixContent');
      if (matrixContent && !matrixContent.classList.contains('hidden')) {
        renderDayProgressRow(timeInfo);
      }
    }

    /* -------------------------------------------------------------
     * EVENT HANDLERS & MODAL MANAGEMENT
     * ------------------------------------------------------------- */
    function updateScheduleModeUI(mode) {
      const normalBtn = document.getElementById('modeNormalBtn');
      const lateBtn = document.getElementById('modeLateBtn');
      const badge = document.getElementById('activeScheduleBadge');
      const subHeading = document.getElementById('matrixSubheading');

      if (mode === 'late') {
        if (normalBtn) normalBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 text-slate-400 hover:text-slate-200";
        if (lateBtn) lateBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 bg-blue-600 text-white shadow-sm";
        if (badge) badge.textContent = "Late Start Schedule (10:55 AM)";
        if (subHeading) subHeading.textContent = "Currently viewing Late Start Schedule times";
      } else {
        if (normalBtn) normalBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 bg-blue-600 text-white shadow-sm";
        if (lateBtn) lateBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 text-slate-400 hover:text-slate-200";
        if (badge) badge.textContent = "Normal Schedule (8:55 AM)";
        if (subHeading) subHeading.textContent = "Currently viewing Normal Schedule times";
      }
    }

    function updateThemeIcon(theme) {
      const icon = document.getElementById('themeIcon');
      if (!icon) return;
      if (theme === 'light') {
        icon.setAttribute('data-lucide', 'moon');
      } else {
        icon.setAttribute('data-lucide', 'sun');
      }
      if (window.lucide) lucide.createIcons();
    }

    function populateConfigModal() {
      const container = document.getElementById('configPeriodsList');
      const audioToggle = document.getElementById('configAudioToggle');
      const teamFocus = document.getElementById('configTeamFocus');
      if (!container) return;

      if (audioToggle) audioToggle.checked = state.audioEnabled;
      if (teamFocus) teamFocus.value = state.teamFocus;

      let html = '';
      PERIOD_KEYS.forEach(pk => {
        const defaultLabel = DEFAULT_PERIOD_LABELS[pk];
        const customVal = state.customLabels[pk] || '';
        const roomVal = state.roomNumbers[pk] || '';

        html += `
          <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-center p-3 rounded-xl bg-slate-850 border border-slate-750">
            <div class="sm:col-span-4">
              <span class="text-xs font-bold uppercase tracking-wider text-slate-300 block">${defaultLabel}</span>
              <span class="text-[11px] text-slate-500 font-mono">${pk}</span>
            </div>
            <div class="sm:col-span-5">
              <input type="text" 
                data-period-label="${pk}" 
                value="${customVal}" 
                placeholder="e.g. Pre-Algebra, Biology..."
                class="w-full px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-100 placeholder:text-slate-500 focus:outline-none focus:border-blue-500" />
            </div>
            <div class="sm:col-span-3">
              <input type="text" 
                data-period-room="${pk}" 
                value="${roomVal}" 
                placeholder="Rm 102"
                class="w-full px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-100 placeholder:text-slate-500 focus:outline-none focus:border-blue-500" />
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      updateShareLinkInput();
    }

    function updateShareLinkInput() {
      const input = document.getElementById('shareableLinkInput');
      if (!input) return;
      try {
        const payload = {
          scheduleMode: state.scheduleMode,
          customLabels: state.customLabels,
          roomNumbers: state.roomNumbers,
          audioEnabled: state.audioEnabled,
          teamFocus: state.teamFocus,
        };
        const encoded = btoa(encodeURIComponent(JSON.stringify(payload)));
        const url = `${window.location.origin}${window.location.pathname}#config=${encoded}`;
        input.value = url;
      } catch (e) {
        input.value = window.location.href;
      }
    }

    /* -------------------------------------------------------------
     * INITIALIZATION
     * ------------------------------------------------------------- */
    function initApp() {
      loadSettings();

      // Apply Initial Theme
      if (state.theme === 'light') {
        document.documentElement.classList.remove('dark');
        updateThemeIcon('light');
      } else {
        document.documentElement.classList.add('dark');
        updateThemeIcon('dark');
      }

      updateScheduleModeUI(state.scheduleMode);
      renderScheduleMatrix();
      tick();

      // Start 1-second interval
      setInterval(tick, 1000);

      // Event: Schedule Mode Header Buttons
      const normalBtn = document.getElementById('modeNormalBtn');
      const lateBtn = document.getElementById('modeLateBtn');
      const themeBtn = document.getElementById('themeToggleBtn');

      if (normalBtn) {
        normalBtn.addEventListener('click', () => {
          state.scheduleMode = 'normal';
          saveSettings();
          updateScheduleModeUI('normal');
          renderScheduleMatrix();
          tick();
          showToast("Switched to Normal Schedule", "info");
        });
      }

      if (lateBtn) {
        lateBtn.addEventListener('click', () => {
          state.scheduleMode = 'late';
          saveSettings();
          updateScheduleModeUI('late');
          renderScheduleMatrix();
          tick();
          showToast("Switched to Late Start Schedule (10:55 AM)", "info");
        });
      }

      // Event: Toggle Schedule Matrix
      const toggleMatrixBtn = document.getElementById('toggleMatrixBtn');
      const matrixContent = document.getElementById('matrixContent');
      const matrixChevron = document.getElementById('matrixChevron');
      const matrixToggleText = document.getElementById('matrixToggleText');

      if (toggleMatrixBtn && matrixContent) {
        toggleMatrixBtn.addEventListener('click', () => {
          const isHidden = matrixContent.classList.contains('hidden');
          if (isHidden) {
            matrixContent.classList.remove('hidden');
            if (matrixChevron) matrixChevron.classList.add('rotate-180');
            if (matrixToggleText) matrixToggleText.textContent = "Hide Schedule";
            renderScheduleMatrix();
          } else {
            matrixContent.classList.add('hidden');
            if (matrixChevron) matrixChevron.classList.remove('rotate-180');
            if (matrixToggleText) matrixToggleText.textContent = "Show Schedule";
          }
        });
      }

      // Event: Smartboard / TV Mode Fullscreen
      const openSbBtn = document.getElementById('openSmartboardBtn');
      const exitSbBtn = document.getElementById('exitSmartboardBtn');
      const sbView = document.getElementById('smartboardView');

      function openSmartboard() {
        sbView.classList.remove('hidden');
        tick();
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      }

      function closeSmartboard() {
        sbView.classList.add('hidden');
        if (document.exitFullscreen && document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
      }

      if (openSbBtn) openSbBtn.addEventListener('click', openSmartboard);
      if (exitSbBtn) exitSbBtn.addEventListener('click', closeSmartboard);

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && sbView && !sbView.classList.contains('hidden')) {
          closeSmartboard();
        }
      });

      // Event: Theme Toggle
      if (themeBtn) {
        themeBtn.addEventListener('click', () => {
          const isDark = document.documentElement.classList.contains('dark');
          if (isDark) {
            document.documentElement.classList.remove('dark');
            state.theme = 'light';
            updateThemeIcon('light');
          } else {
            document.documentElement.classList.add('dark');
            state.theme = 'dark';
            updateThemeIcon('dark');
          }
          saveSettings();
        });
      }

      // Event: Configuration Modal Open/Close & Save
      const openConfigBtn = document.getElementById('openConfigModalBtn');
      const closeConfigBtn = document.getElementById('closeConfigModalBtn');
      const cancelConfigBtn = document.getElementById('cancelConfigBtn');
      const configModal = document.getElementById('configModal');
      const saveConfigBtn = document.getElementById('saveConfigBtn');

      if (openConfigBtn) {
        openConfigBtn.addEventListener('click', () => {
          populateConfigModal();
          configModal.classList.remove('hidden');
        });
      }

      function hideConfigModal() {
        configModal.classList.add('hidden');
      }

      if (closeConfigBtn) closeConfigBtn.addEventListener('click', hideConfigModal);
      if (cancelConfigBtn) cancelConfigBtn.addEventListener('click', hideConfigModal);

      if (saveConfigBtn) {
        saveConfigBtn.addEventListener('click', () => {
          const audioToggle = document.getElementById('configAudioToggle');
          const teamFocus = document.getElementById('configTeamFocus');

          if (audioToggle) state.audioEnabled = audioToggle.checked;
          if (teamFocus) state.teamFocus = teamFocus.value;

          state.customLabels = {};
          state.roomNumbers = {};

          document.querySelectorAll('input[data-period-label]').forEach(inp => {
            const pk = inp.getAttribute('data-period-label');
            const val = inp.value.trim();
            if (val) state.customLabels[pk] = val;
          });

          document.querySelectorAll('input[data-period-room]').forEach(inp => {
            const pk = inp.getAttribute('data-period-room');
            const val = inp.value.trim();
            if (val) state.roomNumbers[pk] = val;
          });

          saveSettings();
          renderScheduleMatrix();
          tick();
          hideConfigModal();
          showToast("Settings saved successfully!", "success");
        });
      }

      // Event: Test Chime Button
      const testChimeBtn = document.getElementById('testChimeBtn');
      if (testChimeBtn) {
        testChimeBtn.addEventListener('click', () => {
          playWarningChime();
          showToast("Chime sound preview played", "info");
        });
      }

      // Event: Generate / Copy Share Link
      const generateShareLinkBtn = document.getElementById('generateShareLinkBtn');
      if (generateShareLinkBtn) {
        generateShareLinkBtn.addEventListener('click', () => {
          updateShareLinkInput();
          const input = document.getElementById('shareableLinkInput');
          if (input) {
            input.select();
            navigator.clipboard.writeText(input.value).then(() => {
              showToast("Configuration link copied to clipboard!", "success");
            }).catch(() => {
              showToast("Link generated in input field", "info");
            });
          }
        });
      }

      // Event: Reset Defaults
      const resetDefaultsBtn = document.getElementById('resetDefaultsBtn');
      if (resetDefaultsBtn) {
        resetDefaultsBtn.addEventListener('click', () => {
          if (confirm("Reset all custom class names, room assignments, and audio preferences to original defaults?")) {
            state.customLabels = {};
            state.roomNumbers = {};
            state.audioEnabled = true;
            state.teamFocus = 'all';
            saveSettings();
            populateConfigModal();
            renderScheduleMatrix();
            tick();
            showToast("Reset to standard defaults", "info");
          }
        });
      }

      // Event: Simulator Preset Buttons
      const simStatusText = document.getElementById('simStatusText');
      function setSimulatedTime(minutes, label) {
        state.simulatedMinutes = minutes;
        simStatusText.textContent = label;
        simStatusText.className = 'text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20 font-bold';
        tick();
        renderScheduleMatrix();
        showToast(`Simulating time: ${minTo12H(minutes)}`, 'info');
      }

      document.getElementById('simPresetAdvisory')?.addEventListener('click', () => {
        setSimulatedTime(timeToMin(9, 5, false), 'Simulated: Advisory (9:05 AM)');
      });
      document.getElementById('simPresetP2')?.addEventListener('click', () => {
        setSimulatedTime(timeToMin(10, 15, false), 'Simulated: 2nd Period (10:15 AM)');
      });
      document.getElementById('simPresetP3Stagger')?.addEventListener('click', () => {
        setSimulatedTime(timeToMin(11, 0, false), 'Simulated: Staggered Lunch (11:00 AM)');
      });
      document.getElementById('simPresetPassing')?.addEventListener('click', () => {
        setSimulatedTime(timeToMin(11, 18, false), 'Simulated: Passing Period (11:18 AM)');
      });
      document.getElementById('simPresetP6Stagger')?.addEventListener('click', () => {
        setSimulatedTime(timeToMin(1, 10, true), 'Simulated: Staggered Lunch (1:10 PM)');
      });
      document.getElementById('simPresetAfterSchool')?.addEventListener('click', () => {
        setSimulatedTime(timeToMin(4, 0, true), 'Simulated: Closed (4:00 PM)');
      });

      document.getElementById('simResetLiveBtn')?.addEventListener('click', () => {
        state.simulatedMinutes = null;
        simStatusText.textContent = 'Live Device Time';
        simStatusText.className = 'text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20 font-medium';
        tick();
        renderScheduleMatrix();
        showToast("Reverted to Live Device Clock", "info");
      });

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    // Boot on DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }

  })();
</script>
